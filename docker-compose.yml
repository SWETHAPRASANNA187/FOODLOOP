services:
  redis:
    image: redis:7-alpine
    container_name: foodloop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - foodloop_redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  foodloop_redis_data:
    name: foodloop_redis_data
