# FoodLoop Redis Configuration
# Port
port 6379

# Network binding
bind 0.0.0.0
protected-mode no

# Persistence settings: Dual AOF + RDB snapshotting
# 1. Append Only File (AOF) - High durability
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 2. RDB Snapshots (periodic snapshots for fast disaster recovery)
save 900 1
save 300 10
save 60 1000
dbfilename dump.rdb
dir /data

# Memory & Eviction Policy:
# IMPORTANT: Redis is the PRIMARY AND ONLY DATABASE for FoodLoop.
# DO NOT use allkeys-lru, volatile-lru, or any policy that silently evicts persistent business records.
# 'noeviction' returns an error if memory limit is reached instead of losing food listings, reservations, or users!
maxmemory 512mb
maxmemory-policy noeviction

# Log level
loglevel notice
